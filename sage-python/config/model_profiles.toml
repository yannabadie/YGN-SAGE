# Model profiles — curated benchmark scores for provider selection
# Source of truth for model capabilities is sage-core/config/cards.toml (Rust)
# This file enriches with Python-side benchmark data
# Updated: 2026-03-30

[models]

# `provider` is REQUIRED on every entry (B2 bug 1, 2026-06-10): entries
# without it materialize as ModelProfile(provider="unknown") whenever the
# model is not live-discovered at boot, which leaks into node_started
# provider_id and trips the canary provider_gate. Values must agree with
# cards.toml (tripwire: tests/test_provider_pool.py
# TestModelProfilesTomlProviderTripwire).

[models."deepseek-v4-flash"]
provider = "deepseek"
reasoning = 0.85
coding = 0.88
speed = 0.95
cost_input_per_1k = 0.00014  # cache-miss; $0.028/1M cache-hit
cost_output_per_1k = 0.00028

[models."gemini-3.1-pro-preview"]
