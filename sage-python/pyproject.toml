[project]
name = "ygn-sage"
version = "0.1.0"
description = "Verified Adaptive Orchestration Runtime — Research Preview multi-agent topology runtime with evidence-gated learning (OracleStack default-on, runtime integrity ledger)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yann Abadie" }]
keywords = [
    "agents",
    "llm",
    "routing",
    "topology",
    "multi-agent",
    "verified-runtime",
    "oracle-gated-learning",
    "evidence-producers",
    "runtime-integrity",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "rich>=13",
    "anyio>=4",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "truststore>=0.9",
    # Runtime Rust extension. Built from ../sage-core with maturin until B4
    # publishes platform wheels. Required for topology execution and dynamic
    # Python tool sandboxing; do not remove unless ygn-sage bundles sage_core.
    "sage-core>=0.1,<0.2",
    # LiteLLM → Pydantic AI migration 2026-04-18 (docs/plans/
    # 2026-04-18-pydantic-ai-migration.md). Pydantic AI ships native
    # providers for openai / google / xai / moonshotai / openrouter and
    # a clean custom-base_url pattern for deepseek / minimax.
    #
    # 2026-05-12 dep fix (B2 preflight): switched from umbrella
    # `pydantic-ai` to `pydantic-ai-slim[needed]` because the umbrella
    # pulls `[mistral]` which depends on `mistralai>=2.0.0` — and
    # `mistralai` is currently QUARANTINED on PyPI
    # (https://pypi.org/simple/mistralai/ → 0 files,
    # pypi:project-status=quarantined). The codebase only imports
    # `pydantic_ai.{models,providers,profiles}.{openai,google,xai,moonshotai}`
    # (see providers/pydantic_ai_provider.py), so dropping the
    # umbrella's mistral/anthropic/groq/cohere/bedrock/vertexai/etc.
    # extras is safe. Re-add specific extras here only when concrete
    # `from pydantic_ai.providers.<name>` imports appear in code.
    "pydantic-ai-slim[openai,google,xai,moonshotai]>=1.84",
    # A27-followup transitive cap. `typer` arrives as a
    # transitive of `huggingface-hub` (via pydantic-ai-slim, transformers
    # in [embeddings], etc.). sage-discover pulls `docling` which pins
    # `typer<0.22.0,>=0.12.5` through 2.91.0 (latest), and the
    # python-discover CI job installs sage-python AND sage-discover into
    # one env. Without this cap pip-compile resolves typer freely (most
    # recently 0.25.0) and the dual `-c constraints.txt` install hits
    # ResolutionImpossible. Cap aligned to docling's range; revisit when
    # docling >= 3.x ships with a wider typer range.
    "typer<0.22",
]

[project.optional-dependencies]
google = ["google-genai>=1.20,<2"]
openai = ["openai>=1.50,<3"]
arrow = ["pyarrow>=18"]
z3 = ["z3-solver>=4.13"]
embeddings = ["sentence-transformers>=2.2"]
ui = ["fastapi>=0.115", "uvicorn>=0.34"]
bench = ["evalplus>=0.3.1"]
mcp = ["mcp>=1.7"]
a2a = [
    # Pinned to 0.3.x: a2a-sdk 1.0 (released 2026-04-24) is a real
    # protocol/runtime migration (AgentCard shape, RequestContext
    # accessors, EventQueue API, streaming validity rules), not just
    # type drift. See protocols/a2a_server.py — the code targets
    # `RequestContext.task`, `EventQueue.put`, camelCase AgentCard
    # kwargs (all 0.3.x names). Migrating to 1.0.x is a separate
    # initiative with runtime smoke tests, not a CI-debt cleanup.
    "a2a-sdk[http-server]>=0.3.25,<1.0",
]
protocols = ["ygn-sage[mcp,a2a]"]
training = [
    # Training deps removed — training code lives in a separate branch.
    # Re-add when training pipeline is reintroduced.
]
all = ["ygn-sage[google,openai,arrow,z3,embeddings,ui,bench,mcp,a2a]"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "ruff>=0.11",
    "mypy>=1.15",
    "ulid-py>=1.1",
    "pyarrow>=18",
    "hypothesis>=6.0",
]

[project.urls]
Homepage = "https://github.com/yannabadie/YGN-SAGE"
Repository = "https://github.com/yannabadie/YGN-SAGE"
Documentation = "https://github.com/yannabadie/YGN-SAGE/tree/master/docs"

[project.scripts]
sage = "sage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "data/",
    "models/",
    "tests/",
    "scripts/",
    "docs/",
    "output/",
    "*.log",
    "*.jsonl",
    "*.csv",
    "*.jpg",
    "*.png",
    "*.enc",
    "*.key",
    "*.xlsx",
    "*.parquet",
    "*.safetensors",
    "*.pt",
    "*.pth",
    "*.txt",
    "test_*.json",
    "sage__*.json",
    ".gitignore",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring a real LLM (GOOGLE_API_KEY)",
    "integration: integration tests requiring optional protocol dependencies",
    "live_provider: live-API tests hitting real LLM providers (opt-in via SAGE_LIVE_PROVIDERS=1)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# Sandbox-eval templates: 1-2 line scripts that rely on injected
# globals (json, args) supplied by the tool runner at execution time.
# They are not standalone Python and have no useful type signal.
# Exclude here so name-defined errors don't pollute CI; the generator
# code at sage.tools.forge / sage.tools.meta IS type-checked.
exclude = [
    "src/sage/tools/generated_tools/",
]

# ── Per-module suppressions (incremental: enable per-module as errors are fixed) ──
# These modules have known type errors that were masked by `|| true` in CI.
# Each module is listed here so the suppression is explicit and auditable.
# All 27 formerly-suppressed modules now pass mypy (April 2026).
# No ignore_errors overrides needed.
