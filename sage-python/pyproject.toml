[project]
name = "ygn-sage"
version = "0.1.0"
description = "Agent Development Kit with 5 cognitive pillars: Topology, Tools, Memory, Evolution, Strategy"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yann Abadie" }]
keywords = ["agents", "llm", "routing", "topology", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "rich>=13",
    "anyio>=4",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "truststore>=0.9",
    "litellm>=1.83",
]

[project.optional-dependencies]
google = ["google-genai>=1.20,<2"]
openai = ["openai>=1.50,<3"]
arrow = ["pyarrow>=18"]
z3 = ["z3-solver>=4.13"]
embeddings = ["sentence-transformers>=2.2"]
ui = ["fastapi>=0.115", "uvicorn>=0.34"]
bench = ["evalplus>=0.3.1"]
mcp = ["mcp>=1.7"]
a2a = ["a2a-sdk[http-server]>=0.3"]
protocols = ["ygn-sage[mcp,a2a]"]
training = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=1.0",
    "pandas>=2.0",
    "pyarrow>=18",
]
all = ["ygn-sage[google,openai,arrow,z3,embeddings,ui,bench,mcp,a2a]"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "ruff>=0.11",
    "mypy>=1.15",
    "ulid-py>=1.1",
    "pyarrow>=18",
    "hypothesis>=6.0",
]

[project.urls]
Homepage = "https://github.com/yannabadie/YGN-SAGE"
Repository = "https://github.com/yannabadie/YGN-SAGE"
Documentation = "https://github.com/yannabadie/YGN-SAGE/tree/master/docs"

[project.scripts]
sage = "sage.protocols.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "data/",
    "models/",
    "tests/",
    "scripts/",
    "docs/",
    "output/",
    "*.log",
    "*.jsonl",
    "*.csv",
    "*.jpg",
    "*.png",
    "*.enc",
    "*.key",
    "*.xlsx",
    "*.parquet",
    "*.safetensors",
    "*.pt",
    "*.pth",
    "*.txt",
    "test_*.json",
    "sage__*.json",
    ".gitignore",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring a real LLM (GOOGLE_API_KEY)",
    "integration: integration tests requiring optional protocol dependencies",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# ── Per-module suppressions (incremental: enable per-module as errors are fixed) ──
# These modules have known type errors that were masked by `|| true` in CI.
# Each module is listed here so the suppression is explicit and auditable.
# All 27 formerly-suppressed modules now pass mypy (April 2026).
# No ignore_errors overrides needed.
