<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YGN-SAGE | Agent UI</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- CDN libs (loaded before modules) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3/dist/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/elkjs@0.9/lib/elk.bundled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <!-- Tailwind config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Consolas', 'monospace'],
                    },
                    colors: {
                        sage: { 950:'#020617', 900:'#0f172a', 800:'#1e293b', 750:'#263348', 700:'#334155', 600:'#475569', 500:'#64748b', 400:'#94a3b8' },
                        s1: '#22c55e', s2: '#f59e0b', s3: '#ef4444',
                    }
                }
            }
        }
    </script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/sage.css">
</head>
<body class="bg-sage-900 text-white">

<!-- Auth Banner (hidden by default, shown if no token) -->
<div id="auth-banner" style="display:none; background:#f59e0b; color:#000; text-align:center; padding:8px; font-weight:600;">
    Warning: No authentication configured. Set SAGE_DASHBOARD_TOKEN for production use.
</div>

<!-- Header -->
<header class="bg-sage-800 border-b border-sage-700 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-4">
        <h1 class="text-lg font-bold tracking-tight">
            <span class="text-sage-400">YGN</span><span class="text-white">-SAGE</span>
        </h1>
        <div id="ws-status" class="flex items-center gap-1.5 text-xs">
            <span id="ws-dot" class="w-2 h-2 rounded-full bg-red-500"></span>
            <span id="ws-label" class="text-sage-500">Disconnected</span>
        </div>
    </div>

    <!-- Tabs -->
    <nav class="flex items-center gap-1">
        <button class="tab-btn active px-3 py-1.5 text-sm font-medium" data-tab="chat">Chat</button>
        <button class="tab-btn px-3 py-1.5 text-sm font-medium" data-tab="dashboard">Dashboard</button>
        <button class="tab-btn px-3 py-1.5 text-sm font-medium" data-tab="topology">Topology</button>
        <button class="tab-btn px-3 py-1.5 text-sm font-medium" data-tab="providers">Providers</button>
    </nav>

    <!-- Status indicators -->
    <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 text-xs">
            <div id="s1-ind" class="flex items-center gap-1 px-2 py-1 rounded border border-sage-700 opacity-40"><span class="w-2 h-2 rounded-full bg-s1"></span><span class="font-medium">S1</span></div>
            <div id="s2-ind" class="flex items-center gap-1 px-2 py-1 rounded border border-sage-700 opacity-40"><span class="w-2 h-2 rounded-full bg-s2"></span><span class="font-medium">S2</span></div>
            <div id="s3-ind" class="flex items-center gap-1 px-2 py-1 rounded border border-sage-700 opacity-40"><span class="w-2 h-2 rounded-full bg-s3"></span><span class="font-medium">S3</span></div>
        </div>
        <div class="h-6 w-px bg-sage-700"></div>
        <div class="text-xs text-sage-400">
            Step <span id="hdr-step" class="text-white font-mono">0</span> &middot;
            $<span id="hdr-cost" class="text-white font-mono">0.0000</span> &middot;
            <span id="hdr-model" class="text-sage-400 font-mono">--</span>
        </div>
    </div>
</header>

<!-- Main content -->
<main class="h-[calc(100vh-52px)] flex flex-col">
    <!-- Tab panels (stacked, only active one visible) -->
    <div class="flex-1 min-h-0 relative">
        <div id="panel-chat" class="tab-panel active absolute inset-0"></div>
        <div id="panel-dashboard" class="tab-panel absolute inset-0"></div>
        <div id="panel-topology" class="tab-panel absolute inset-0"></div>
        <div id="panel-providers" class="tab-panel absolute inset-0"></div>
    </div>
    <!-- Event stream bar (always visible, resizable) -->
    <div id="events-bar" class="flex-shrink-0 bg-sage-800 border-t border-sage-700" style="height:220px; min-height:80px; resize:vertical; overflow:hidden;">
        <div id="events-container" class="h-full"></div>
    </div>
</main>

<!-- Module loader -->
<script type="module">
    import { getState, setState, subscribe, resetState } from '/static/js/state.js';
    import { connectWebSocket } from '/static/js/ws.js';
    import * as chat from '/static/js/chat.js';
    import * as dashboard from '/static/js/dashboard.js';
    import * as topology from '/static/js/topology.js';
    import * as providers from '/static/js/providers.js';
    import * as events from '/static/js/events.js';

    const modules = { chat, dashboard, topology, providers };
    let activeTab = 'chat';

    // Mount event stream (always visible)
    events.mount(document.getElementById('events-container'));

    // Mount initial tab
    chat.mount(document.getElementById('panel-chat'));

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const tab = btn.dataset.tab;
            if (tab === activeTab) return;

            // Unmount old
            modules[activeTab]?.unmount();
            document.getElementById(`panel-${activeTab}`).classList.remove('active');
            document.querySelector(`.tab-btn[data-tab="${activeTab}"]`).classList.remove('active');

            // Mount new
            activeTab = tab;
            const panel = document.getElementById(`panel-${tab}`);
            panel.classList.add('active');
            btn.classList.add('active');
            modules[tab]?.mount(panel);
        });
    });

    // WebSocket status + header stats — subscribe receives (hint), read state via getState()
    subscribe(() => {
        const s = getState();
        const dot = document.getElementById('ws-dot');
        const label = document.getElementById('ws-label');
        if (dot && label) {
            dot.className = `w-2 h-2 rounded-full ${s.wsConnected ? 'bg-green-500' : 'bg-red-500'}`;
            label.textContent = s.wsConnected ? 'Connected' : 'Disconnected';
        }
        const $t = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
        $t('hdr-step', s.stepCount);
        $t('hdr-cost', s.totalCost.toFixed(4));
        $t('hdr-model', s.lastModel || '--');

        ['s1-ind', 's2-ind', 's3-ind'].forEach((id, idx) => {
            const el = document.getElementById(id);
            if (!el) return;
            if (s.lastSystem === idx + 1) {
                el.classList.remove('opacity-40');
                el.classList.add('opacity-100', 'running-glow');
                el.style.borderColor = ['#22c55e', '#f59e0b', '#ef4444'][idx];
            } else {
                el.classList.remove('opacity-100', 'running-glow');
                el.classList.add('opacity-40');
                el.style.borderColor = '';
            }
        });
    });

    // Auth check
    fetch('/api/state').then(r => r.json()).then(d => {
        if (!d.auth_enabled) document.getElementById('auth-banner').style.display = 'block';
    }).catch(() => {});

    // Start
    connectWebSocket();
</script>
</body>
</html>
