[package]
name = "sage-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "sage_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "time"] }
ulid = { version = "1", features = ["serde"] }
thiserror = "2"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33.0"
raw-cpuid = "11.2"
arrow = { version = "55.0", features = ["ffi"] }
arrow-array = "55.0"
pyo3-arrow = "0.10.0"
# wasmtime v44 (April 2026; bumped from v43 to clear 11 RustSec
# advisories: sandbox-escape on cranelift x86-64 / aarch64, host
# panics on Winch table.fill / flags lifting, heap OOB in component
# UTF-16 transcoding, use-after-free on Linker clone, pooling
# allocator data leakage, etc. — all fixed in 44.x). Cwasm cache
# remains version-keyed via build.rs hash so stale .cwasm artefacts
# self-invalidate on the upgrade.
# Lockfile floor 44.0.2 since 2026-06-10: RUSTSEC-2026-0149 /
# GHSA-2r75-cxrj-cmph (CVSS 7.5) — WASI path_open(TRUNCATE) bypassed
# FilePerms::WRITE in <=44.0.1. Patch release, no API change; the "44.0"
# req below already admits it.
# cranelift feature EXCLUDED on Windows: causes STATUS_STACK_BUFFER_OVERRUN
# during MSVC compilation. Use pre-compiled modules + Component::deserialize().
# On Linux, add "cranelift" feature for JIT compilation.
wasmtime = { version = "44.0", optional = true, default-features = false, features = ["runtime", "component-model", "std"] }
wasmtime-wasi = { version = "44.0", optional = true, default-features = false, features = ["p1"] }
# solana_rbpf removed: its build script cross-compiles for BPF target,
# causing CI failure on Ubuntu even when optional. Re-add in Phase 2.
# solana_rbpf = { version = "0.8.5", optional = true }
numpy = "0.25"
petgraph = "0.6.4"
# ort uses load-dynamic: loads onnxruntime DLL at runtime (via ORT_DYLIB_PATH or pip onnxruntime).
# This avoids static linking errors (LNK1120) on Windows MSVC that occurred with copy-dylibs.
ort = { version = "2.0.0-rc.12", optional = true, features = ["load-dynamic"] }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["progressbar", "fancy-regex"] }
ndarray = { version = "0.16", optional = true }
tree-sitter = { version = "0.26", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
process-wrap = { version = "9", optional = true, features = ["tokio1"] }
oxiz = { version = "0.2", optional = true }
tracing = "0.1"
# B1.b OTel Rust bridge (2026-04-25). All gated behind the `otel`
# feature — opt-in for now, may move into default features once
# downstream stability is proven (see roadmap-B1.b.8).
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", optional = true }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "http-json", "reqwest-client", "trace"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"], optional = true }
opentelemetry-stdout = { version = "0.27", optional = true }
toml = "0.8"
rand = "0.9"
rand_chacha = "0.9"
# Plan 2.2 (2026-04-20): regex for TopologyController port (path 1
# error-pattern detection, path 6 emergent-subtask detection). Already
# in the workspace Cargo.lock transitively; pinning here makes it
# first-class for this crate.
regex = "1.10"
rusqlite = { version = "0.33", features = ["bundled"], optional = true }
# SHA-256 for the wasm precompile cache key (sandbox/wasm_python). Already
# transitively in the workspace via several upstream crates — hoisting it
# to a direct dep so the cache module doesn't depend on implicit access.
sha2 = "0.10"

[features]
# P3.4 (2026-04-22 audit remediation): `cognitive` moved into default so
# persistent bandit state (load_state/save_state wired in
# sage-python/src/sage/boot_topology.py) works out of the box without
# requiring `maturin develop --features cognitive`. AUDIT4 bug #6's
# complaint "apprentissage perdu au redemarrage" was driven by default
# builds not including the SQLite-backed persistence; this closes that
# gap. Operators who explicitly want the leanest build can still pass
# `--no-default-features` and opt back in per-feature.
#
# §5 flip (2026-04-22 post red-team corpus): `sandbox` + `cranelift`
# + `tool-executor` moved into default. `validate_and_execute` now
# runs in the embedded RustPython wasm sandbox by default; the old
# SAGE_UNSAFE_UNSANDBOXED subprocess gate is removed. Default builds
# bundle a ~37 MB rustpython.wasm (once built per the recipe in
# sage-core/src/sandbox/wasm_python.rs). Operators who want the
# leanest build can still pass `--no-default-features` and opt back
# in per-feature.
default = [
    "extension-module",
    "cognitive",
    "sandbox",
    "cranelift",
    "tool-executor",
]
extension-module = ["pyo3/extension-module", "pyo3/multiple-pymethods"]
sandbox = ["wasmtime", "dep:wasmtime-wasi"]
# On Linux CI, use sandbox + cranelift for JIT compilation.
# On Windows, sandbox alone uses pre-compiled modules only.
cranelift = ["wasmtime/cranelift"]
onnx = ["dep:ort", "dep:tokenizers", "dep:ndarray"]
tool-executor = ["dep:tree-sitter", "dep:tree-sitter-python", "dep:process-wrap"]
cognitive = ["dep:rusqlite"]
smt = ["dep:oxiz"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:opentelemetry-stdout",
]

[dev-dependencies]
pyo3 = { version = "0.25", features = ["auto-initialize"] }
# Isolated cache directories for wasm_python JIT-cache tests. Already in
# Cargo.lock via wasmtime's dev-deps, promoted to a first-class dev-dep.
tempfile = "3"
# B1.b Task 5: InMemorySpanExporter for the Rust OTel end-to-end smoke
# (tests/otel_smoke.rs). The `testing` feature pulls rt-tokio +
# rt-async-std + tokio/rt-multi-thread, which we deliberately keep out
# of the production `otel` feature surface — dev-only.
opentelemetry_sdk = { version = "0.27", features = ["testing"] }

[lints]
workspace = true
