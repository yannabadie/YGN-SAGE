# --- Kimi models ---

[[models]]
# A8 migration (2026-04-24): `kimi-k2.5` → `kimi-k2.6`.
# Source (per Directive #6, verified against live docs 2026-04-24):
#   https://platform.kimi.ai/docs/guide/kimi-k2-6-quickstart
#   "Kimi's latest and most intelligent model". 256K context.
#   Blog: https://www.kimi.com/blog/kimi-k2-6
#
# IMPORTANT — reasoning_content contract CARRIES OVER from k2.5:
# The kimi-k2.6 quickstart explicitly states:
#   "During multi-step tool calling, you must keep the
#    `reasoning_content` from the assistant message in the current
#    turn's tool call within the context, otherwise an error will be
#    thrown."
# This is the same constraint that made k2.5 HTTP-400 on the 4th
# tool-call turn in SAGE (F9, 2026-04-19). Pydantic AI's message
# serializer still strips `reasoning_content` between turns, so
# multi-turn tool-calling against k2.6 with thinking enabled will
# exhibit the same failure. Reproduced 2/2 deterministically on
# astropy-14182 + astropy-7746 in the 2026-04-23 and 2026-04-24
# observe smokes.
#
# Path forward to unlock tools on kimi (ticketed as follow-up):
#   1. plumb `thinking: {type: "disabled"}` through the Pydantic AI
#      provider for kimi-k2.6 whenever the request carries tools.
#      k2.6 supports the disable toggle per its quickstart, which
#      drops the reasoning_content requirement and uses standard
#      OpenAI-compat tool protocol. Caveats: with thinking disabled,
#      k2.6 may lose reasoning quality (it's a thinking-by-default
#      model). Needs an ablation smoke.
#   2. OR fix the Pydantic AI serializer to preserve reasoning_content
#      across turns. More invasive, but keeps thinking's reasoning
#      benefit. Needs upstream PR or local wrapper.
#
# Until one of those ships: supports_tools stays `false` so the Rust
# ModelAssigner (model_assigner.rs:289) excludes k2.6 from
# template-built tool-using nodes. A7 (2026-04-24, commit c20aefd8)
# ensures every non-sink template role declares `"tools"` in its
# required_capabilities so the filter actually fires. kimi remains
# routable for pure-text sink roles (synthesizer-style) where the
# LLM emits 1 turn with no tool-call chain — no 400 possible.
#
# Other k2.6 quirks (from the live quickstart):
#   - With thinking enabled, `tool_choice` must be "auto" or "none"
#     (no forced-tool).
#   - `$web_search` builtin is "temporarily incompatible with
#     Kimi K2.6/K2.5 thinking mode".
#   - `temperature` and `top_p` are fixed when thinking enabled —
#     custom values cause errors.
#   - Default max_tokens 32768; no explicit minimum (k2.5 required
#     16000 minimum, k2.6 relaxed that).
#
# Context window bump 128000 → 262144 (256K) per the live quickstart;
# the earlier 128k was a stale pre-k2.5 carryover.
