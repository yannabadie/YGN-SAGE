name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC

# Third-party actions are pinned to full commit SHAs per supply-chain
# hardening (ALIRE2 / AUDIT-annex A17). The trailing `# <tag>` comment
# records which upstream release each SHA corresponds to so that
# upgrades stay traceable. See docs/security/supply-chain.md.

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # NOTE: github/codeql-action v4 is the currently-pinned major for
      # this repo; v3 is upstream-stable. Track via:
      #   gh api repos/github/codeql-action/git/refs/tags/v4 --jq .object.sha
      - uses: github/codeql-action/init@b25d0ebf40e5b63ee81e1bd6e5d2a12b7c2aeb61 # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@b25d0ebf40e5b63ee81e1bd6e5d2a12b7c2aeb61 # v4

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install cyclonedx-bom
      # A21: sage-python declares sage-core>=0.1,<0.2 as a runtime dep but
      # sage-core is not yet on PyPI (B4). Build + install the wheel locally
      # so the constrained sage-python install can resolve sage-core without hitting
      # the registry.
      - name: Build sage_core wheel + install (required for sage-python)
        working-directory: sage-core
        run: |
          pip install maturin
          maturin build --release --features smt,onnx --out target/wheels
          pip install target/wheels/sage_core-*.whl --force-reinstall --no-deps
      - run: |
          cd sage-python
          pip install -c constraints.txt -e ".[all,dev]"
          cyclonedx-py environment -o ../sbom.json --output-format json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.json

  # --- AUDIT-annex A17: minimum-viable supply-chain gates ---
  # A23/A27 follow-ups restored these jobs as hard gates on 2026-04-27:
  # pip-audit runs against locked constraints, and cargo-audit/cargo-deny
  # are backed by wasmtime 44 + documented deny.toml quarantines.

  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      # A27-followup: audit the LOCKED constraints (which represent the actual
      # versions we ship), not free pyproject metadata. pip-audit's two
      # supported avoidance paths for environment resolution are: audit an
      # already-installed env, OR audit a fully pinned requirements file with
      # `--no-deps`. The `--disable-pip` path required `--no-deps` or hashed
      # reqs anyway and was emitting an error before `|| true` could swallow
      # it, so we drop it.
      #
      # We also strip the local `sage-core==0.1.0` line from the audit input
      # because sage-core is not yet on PyPI (B4); pip-audit would fail to
      # resolve it through the OSV vuln service.
      - name: Stage pinned constraint files for audit
        run: |
          python - <<'PY'
          from pathlib import Path

          pairs = [
              ("sage-python/constraints.txt", "audit-sage-python.txt"),
              ("sage-discover/constraints.txt", "audit-sage-discover.txt"),
          ]

          for src, dst in pairs:
              out = []
              for raw in Path(src).read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or line.startswith("--"):
                      continue
                  if line.lower().startswith("sage-core==") or line.lower().startswith("ygn-sage=="):
                      # local-only packages, not on PyPI until B4
                      continue
                  out.append(line)
              Path(dst).write_text("\n".join(out) + "\n", encoding="utf-8")
              print(f"wrote {dst} ({len(out)} pinned packages)")
          PY
      - name: Audit sage-python pinned constraints
        run: pip-audit --strict --vulnerability-service osv --no-deps -r audit-sage-python.txt
      - name: Audit sage-discover pinned constraints
        run: pip-audit --strict --vulnerability-service osv --no-deps -r audit-sage-discover.txt
      # Also run the pypa action so the output lands in the GitHub
      # Security tab when a SARIF-capable step is wired later.
      - name: Reference pypa/gh-action-pip-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: sage-python/pyproject.toml

  cargo-audit:
    name: cargo-audit (Rust deps)
    runs-on: ubuntu-latest
    # A23-security-followup landed 2026-04-27: wasmtime 43.0 → 44.0
    # cleared 11 RustSec advisories (sandbox-escape on cranelift x86-64
    # / aarch64, host panics, OOB transcoding, UAF on Linker clone,
    # pooling allocator data leakage). The remaining `rand` and
    # `async-std` advisories are quarantined in deny.toml with
    # rationale. Hard gate restored.
    defaults:
      run:
        working-directory: sage-core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # TODO(A17): dtolnay/rust-toolchain publishes only floating branch
      # refs (`stable`, `nightly`) — no versioned tags. Track upstream
      # for an SHA-pinnable release or mirror to a fork.
      - uses: dtolnay/rust-toolchain@stable
      - name: Run rustsec/audit-check
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo-deny (license + advisories + bans)
    runs-on: ubuntu-latest
    # A23-security-followup landed 2026-04-27: wasmtime 43.0 → 44.0
    # cleared 11 RustSec advisories (sandbox-escape on cranelift x86-64
    # / aarch64, host panics, OOB transcoding, UAF on Linker clone,
    # pooling allocator data leakage). The remaining `rand` and
    # `async-std` advisories are quarantined in deny.toml with
    # rationale. Hard gate restored.
    defaults:
      run:
        working-directory: sage-core
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@5bb39ff5d5a0e94dc9e2dc94eced0c6129743a57 # v2
        with:
          manifest-path: sage-core/Cargo.toml
          command: check
          arguments: --all-features
