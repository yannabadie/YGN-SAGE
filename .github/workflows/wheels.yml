name: Build wheels (B4 — Phase 9 release pipeline)

# AUDITRUST.md Phase 9: multi-OS wheel build matrix + release trigger
# + PyPI publish.  Triggered on version tags (v*) for release;
# manual dispatch for audit/smoke runs.
#
# PyPI publish requires PYPI_TOKEN secret configured in repo settings.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this dispatch (audit trail)"
        required: true
        type: string
      include_smt_onnx:
        description: "Build with --features smt,onnx (heavier wheel, opt-in)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            python: "3.12"
            manylinux: "2014"
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            python: "3.13"
            manylinux: "2014"
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            python: "3.12"
            manylinux: "auto"
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            python: "3.13"
            manylinux: "auto"
          - target: aarch64-apple-darwin
            runner: macos-14  # Apple Silicon (M1/M2)
            python: "3.12"
            manylinux: "auto"
          - target: aarch64-apple-darwin
            runner: macos-14
            python: "3.13"
            manylinux: "auto"

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          submodules: recursive  # external/rustpython-wasm-target

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Rust (matches Cargo.toml edition 2021 / pyo3 0.25)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo + maturin target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sage-core/target
            external/rustpython-wasm-target
          key: wheels-${{ matrix.target }}-${{ matrix.python }}-${{ hashFiles('sage-core/Cargo.lock', 'sage-core/Cargo.toml') }}
          restore-keys: |
            wheels-${{ matrix.target }}-${{ matrix.python }}-

      - name: Build embedded RustPython wasm artifact (cached via cargo target)
        # build.rs in sage-core looks for external/rustpython-wasm-target/.../rustpython.wasm.
        # First-time build is ~10-15 min; the cargo target cache above amortises
        # subsequent runs to under 1 min on the wasm artefact + ~5 min on the
        # PyO3 cdylib link.
        #
        # REVIEW3 P0-4 (2026-05-08): pin RustPython to the same SHA that CI
        # validated.  Unpinned clone (--depth=1) risks embedding a different
        # revision than the one tested in CI.
        shell: bash
        run: |
          if [ ! -f external/rustpython-wasm-target/wasm32-wasip1/release/rustpython.wasm ]; then
            rustup target add wasm32-wasip1
            if [ ! -d external/rustpython ]; then
              sha="$(tr -d '[:space:]' < sage-core/rustpython-wasm.sha)"
              git init external/rustpython
              git -C external/rustpython remote add origin https://github.com/RustPython/RustPython.git
              git -C external/rustpython fetch --depth 1 origin "$sha"
              git -C external/rustpython checkout --detach FETCH_HEAD
            fi
            cd external/rustpython && CARGO_TARGET_DIR=../rustpython-wasm-target \
              cargo build --release --target wasm32-wasip1 --features freeze-stdlib
          else
            echo "rustpython.wasm cached, skipping rebuild"
          fi

      - name: Build wheel (default features only)
        if: ${{ !inputs.include_smt_onnx }}
        uses: PyO3/maturin-action@v1
        with:
          working-directory: sage-core
          target: ${{ matrix.target }}
          # cycle-10 hot-fix (cgpro 2026-05-04 closure review):
          # manylinux2014 must be explicit on Linux runs or the Linux
          # wheel gets tagged `linux_x86_64` (rejected by PyPI for
          # broad install) instead of `manylinux2014_x86_64`. On
          # Windows/macOS, `manylinux: auto` is a no-op (maturin
          # ignores it for non-Linux targets).
          manylinux: ${{ matrix.manylinux }}
          # `-i python${{ matrix.python }}` forces maturin to target
          # the matrix-specified interpreter inside the manylinux
          # container (where actions/setup-python doesn't apply).
          # Default features come from sage-core/pyproject.toml
          # [tool.maturin].features = ["sandbox", "cranelift", "tool-executor",
          # "cognitive"]. The maturin-action invocation does not append
          # extra --features so the pyproject defaults apply verbatim.
          args: --release --strip --out dist -i python${{ matrix.python }}

      - name: Build wheel (with smt + onnx, heavier)
        if: ${{ inputs.include_smt_onnx }}
        uses: PyO3/maturin-action@v1
        with:
          working-directory: sage-core
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --strip --out dist -i python${{ matrix.python }} --features smt,onnx,sandbox,cranelift,tool-executor,cognitive

      - name: List artifacts
        shell: bash
        run: |
          echo "Built wheels:"
          ls -la sage-core/dist/
          echo ""
          echo "Wheel sizes:"
          du -h sage-core/dist/*.whl

      - name: Smoke test — import in fresh venv
        shell: bash
        run: |
          python -m venv /tmp/smoke-venv-${{ matrix.python }}
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_BIN="/tmp/smoke-venv-${{ matrix.python }}/Scripts"
          else
            VENV_BIN="/tmp/smoke-venv-${{ matrix.python }}/bin"
          fi
          "$VENV_BIN/python" -m pip install --upgrade pip
          "$VENV_BIN/python" -m pip install sage-core/dist/*.whl
          "$VENV_BIN/python" -c "
          import sage_core
          # Cycle-10 P5 smoke (cgpro 2026-05-04 closure hot-fix #3):
          # the previous smoke list used HybridVerifier/LtlVerifier as
          # smt-gated probes — both wrong:
          # - The Rust pyclass is `PyHybridVerifier` (no #[pyclass(name =)]
          #   rename), so 'HybridVerifier' was always-absent regardless
          #   of features.
          # - LtlVerifier doesn't exist; the Rust types are LtlResult and
          #   GraphPropertyChecker (renamed per ADR-014), both always-on
          #   (NOT smt-gated).
          # Real smt-gated pyclasses: SmtVerifier, SmtVerificationResult,
          # QualityLabeler, QualityLabel.
          #
          # Verified against sage-core/src/lib.rs (m.add_class lines 84,
          # 103, 104, 113, 114, 115) at HEAD post-cycle-10.

          # Symbols required for the DEFAULT wheel (per
          # sage-core/pyproject.toml [tool.maturin].features =
          # sandbox + cranelift + tool-executor + cognitive):
          default_required = [
              'TopologyEngine', 'SystemRouter', 'ContextualBandit',
              'ModelAssigner', 'ModelRegistry', 'MultiViewMMU',
              'WorkingMemory', 'ToolExecutor',
              # Verifiers (always-on, no smt feature required)
              'PyHybridVerifier',     # raw pyclass name; not aliased
              'VerificationResult',
              'GraphPropertyChecker', # renamed from LtlVerifier per ADR-014
              'LtlResult',
          ]
          missing = [s for s in default_required if not hasattr(sage_core, s)]
          assert not missing, f'sage_core wheel missing default symbols: {missing}'
          # smt-gated pyclasses (oxiz dep). In default wheel they MUST be
          # absent. In include_smt_onnx variant they MUST be present.
          smt_symbols = ['SmtVerifier', 'SmtVerificationResult']
          # smt + tool-executor gated (always-on tool-executor, so
          # quality_labeler activates with smt only on default wheel
          # which already has tool-executor):
          smt_te_symbols = ['QualityLabeler', 'QualityLabel']
          want_smt = '${{ inputs.include_smt_onnx }}' == 'true'
          present_smt = [s for s in smt_symbols if hasattr(sage_core, s)]
          present_smt_te = [s for s in smt_te_symbols if hasattr(sage_core, s)]
          if want_smt:
              if len(present_smt) != len(smt_symbols):
                  raise AssertionError(f'smt wheel missing {set(smt_symbols)-set(present_smt)}')
              if len(present_smt_te) != len(smt_te_symbols):
                  raise AssertionError(f'smt+tool-executor wheel missing {set(smt_te_symbols)-set(present_smt_te)}')
          else:
              if present_smt:
                  raise AssertionError(f'default wheel must NOT carry smt symbols, got {present_smt}')
              if present_smt_te:
                  raise AssertionError(f'default wheel must NOT carry quality_labeler symbols, got {present_smt_te}')
          print('sage_core wheel smoke OK on ${{ matrix.target }} py${{ matrix.python }}')
          print(f'  default symbols: {len(default_required)}/{len(default_required)}')
          print(f'  smt symbols: {len(present_smt)}/{len(smt_symbols)} (want={want_smt})')
          print(f'  qual_labeler: {len(present_smt_te)}/{len(smt_te_symbols)} (want={want_smt})')
          "

      - name: Manifest contract smoke (cycle-13 B Q2)
        # Cycle-13 B Q2 follow-up (cgpro 2026-05-06 NEXT_BLOCK_ID=H):
        # the inline symbols smoke above only checks "is the symbol
        # exposed" — it does NOT exercise the runtime contract that
        # `engine.save_state(tmp)` writes a topology_state_manifest.json
        # with byte-exact SHA256 binding. The 2026-04-27 -> 2026-04-30
        # gap shipped wheels that imported cleanly + had every symbol
        # but DIDN'T write the manifest (engine.rs:1031 leak), forcing
        # operators to run `python -m sage.ops.a14_reset` per cycle.
        # `python -m sage.ops.wheel_smoke` carries the manifest contract
        # assertion as a runtime check — fail-loud at CI time so a
        # broken wheel can NEVER reach TestPyPI / PyPI.
        # Source: sage-python/src/sage/ops/wheel_smoke.py.
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_BIN="/tmp/smoke-venv-${{ matrix.python }}/Scripts"
          else
            VENV_BIN="/tmp/smoke-venv-${{ matrix.python }}/bin"
          fi
          # The wheel_smoke module is shipped inside sage-python — install
          # it (it has zero deps beyond stdlib + the freshly-installed
          # sage_core wheel) and execute.
          "$VENV_BIN/python" -m pip install --no-deps -e sage-python
          "$VENV_BIN/python" -m sage.ops.wheel_smoke

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: sage-core-${{ matrix.target }}-py${{ matrix.python }}${{ inputs.include_smt_onnx && '-smt-onnx' || '' }}
          path: sage-core/dist/*.whl
          retention-days: 30

  # ── PyPI publish (Phase 9, tag-triggered only) ────────────────────
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: sage-core-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
