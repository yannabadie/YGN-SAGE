name: rust-core-coverage

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust-coverage:
    runs-on: ubuntu-latest
    env:
      SAGE_REQUIRE_WASM: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Coverage
        working-directory: sage-core
        run: |
          cargo llvm-cov clean
          cargo llvm-cov -p sage-core \
            --no-default-features \
            --features smt,cognitive,sandbox,cranelift,tool-executor \
            --fail-under-lines 65 \
            --lcov \
            --output-path lcov.info
