name: Stochastic empirical tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  empirical-rust:
    name: Rust ignored empirical stochastic tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Run ignored empirical stochastic tests
        working-directory: sage-core
        run: |
          cargo test --features smt --lib empirical_ -- --ignored --test-threads=1
