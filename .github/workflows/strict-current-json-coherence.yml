name: Strict current.json coherence

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-current-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check semantic coherence (ignore volatile fields)
        run: |
          python scripts/status_snapshot.py
          python - <<'PY'
          import difflib, json, pprint, sys
          from pathlib import Path
          
          repo = Path(".")
          committed = json.loads((repo / "docs/status/current.json").read_text())
          
          # Regenerate
          import subprocess
          subprocess.run(["python", "scripts/status_snapshot.py"], check=True)
          generated = json.loads((repo / "docs/status/current.json").read_text())
          
          # Restore committed version
          (repo / "docs/status/current.json").write_text(json.dumps(committed, indent=2))
          
          VOLATILE = {"generated_at_utc", "generated_for_commit_sha", 
                       "git", "schema_version", "notes"}
          
          def strip(v):
              if isinstance(v, dict):
                  return {k: strip(v[k]) for k in sorted(v) if k not in VOLATILE}
              if isinstance(v, list):
                  return [strip(i) for i in v]
              return v
          
          c = strip(committed)
          g = strip(generated)
          
          if c != g:
              print("FAIL: semantic divergence detected")
              print(difflib.unified_diff(
                  pprint.pformat(c, sort_dicts=True).splitlines(),
                  pprint.pformat(g, sort_dicts=True).splitlines(),
                  fromfile="committed", tofile="generated", lineterm=""))
              sys.exit(1)
          print("OK: current.json semantic payload is coherent")
          PY

      - name: SHA distance diagnostic (non-blocking)
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          data = json.loads(Path("docs/status/current.json").read_text())
          sha = data.get("generated_for_commit_sha","?")
          head = subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          print(f"generated_for={sha[:12]} HEAD={head[:12]}")
          if sha:
              try:
                  d = subprocess.check_output(["git","rev-list","--count",f"{sha}..{head}"],text=True).strip()
                  print(f"distance={d} (diagnostic only)")
              except:
                  print("SHA not reachable (diagnostic only)")
          PY
