# Routing claims — single-source-of-truth for status of routing capabilities.
#
# This file is consumed by `python -m sage.ops.claims_audit` and aggregated
# into `docs/CLAIMS.yaml` by `scripts/regenerate_claims_index.py`.
#
# DO NOT edit `docs/CLAIMS.yaml` directly — edits there are overwritten.
# Edit the per-category file (this one) instead.
#
# Status vocabulary:
#   delivered        : capability shipped + has evidence_test/evidence_benchmark
#                      anchor + evidence_commit pinned (loose-OR Phase 0.4)
#   default-on       : delivered + active in default boot path (no env-var opt-in)
#   opt-in           : delivered, gated by env-var or config flag (default off)
#   planned          : capability designed (spec / ADR / roadmap entry) but NOT shipped
#   parked           : code exists but explicitly not executed on `main` (e.g. training)
#   retired          : capability deliberately removed / superseded
#   evidence_pending : status delivered/default-on but no anchor pinned yet.
#                      MUST flip to a definitive status before claim is cited
#                      in marketing-grade docs (README headline, etc.).

claims:
  - id: routing.knn_92pct
    status: delivered
    description: "Frozen kNN routing exemplar invariant: 5-NN weighted cosine LOO-CV over the 60-task human GT set must score >= 50/60 overall, with S1 >= 16/20, S2 >= 15/20, S3 >= 19/20. Historical ~92% was measured on an earlier 50-task GT and is provenance only, not recertified by this floor."
    evidence_test: "sage-python/tests/test_routing_gt_invariant.py::test_knn_routing_exemplars_loo_cv_floor"
    evidence_benchmark: "n/a"
    evidence_commit: "evidence_pending"
    last_verified_utc: "2026-05-07T00:00:00Z"
    owner: "yann"
    notes: |
      CI-runnable strict-equal floor over committed
      `sage-python/config/routing_ground_truth.json` +
      `sage-python/config/routing_exemplars.npz` (60 × 768 float32
      L2-normalized, built once via
      `scripts/build_routing_exemplars.py`).

      The test validates artifact shape/dtype/L2-norm/label alignment
      first, then runs byte-equivalent LOO-CV (cosine dot product, k=5,
      `np.argpartition`, weighted majority vote) — same mechanics as the
      builder's `--validate` path.

      Empirical baseline 2026-05-07: 50/60 overall, S1=16/20, S2=15/20,
      S3=19/20. Floors are strict-equal to the baseline because the
      dataset and scoring rule are frozen — any artifact regeneration or
      router/scoring drift that loses even one current correct route MUST
      be visible in CI immediately. If `routing_ground_truth.json`,
      `routing_exemplars.npz`, or the scoring logic changes intentionally,
      update the floor constants in the same commit, with the new measured
      baseline documented here.

      The historical 92% figure traces back to
      `scripts/eval_deberta_zeroshot.py:625` — "kNN (arctic-embed): 92.0%
      (46/50)" — measured on a 50-task subset prior to the GT expansion to
      60 tasks. Provenance only, not directly comparable.

  - id: routing.system_router_88pct
    status: delivered
    description: "Rust SystemRouter legacy route(task, budget=1.0) invariant: over the 60-task human GT set and `sage-core/config/cards.toml`, the router must score >= 52/60 overall. Historical ~88% is provenance only; this claim is pinned to the committed 60-task CI floor."
    evidence_test: "sage-python/tests/test_routing_gt_invariant.py::test_system_router_gt_floor"
    evidence_benchmark: "n/a"
    evidence_commit: "evidence_pending"
    last_verified_utc: "2026-05-07T00:00:00Z"
    owner: "yann"
    notes: |
      CI-runnable strict-equal floor over the committed GT and
      `sage-core/config/cards.toml`. Calls
      `sage_core.SystemRouter(registry).route(task, 1.0)` and compares
      `decision.system` to the human-labeled `expected_system`. Budget
      value is part of the invariant — the legacy `route(task, budget)`
      signature can downgrade the selected model under tight budgets,
      which can change `final_system` via model affinity.

      Empirical baseline 2026-05-07: 52/60 overall (budget=1.0 and
      budget=1_000_000.0 produce identical results on the current
      cards.toml; budget=1.0 is locked as the canonical invariant
      anchor).

      The test uses `pytest.importorskip("sage_core")` for developer
      environments where the PyO3 extension is not built. CI gate runs
      MUST have sage_core built (the canonical CI Python jobs do); a
      skip on CI is not acceptable closure evidence.

      The historical 88% figure is provenance only; SystemRouter routing
      logic uses structural features and formal-keyword detection plus
      model-card affinity scoring, not pure domain-text pattern matching.

  - id: routing.complexity_heuristic_emergency_only
    status: retired
    description: "Heuristic ComplexityRouter (~34% GT) — fallback only, never primary. Wired at pipeline.py Priority-3 after Rust SystemRouter + kNN."
    evidence_test: "n/a"
    evidence_benchmark: "n/a"
    evidence_commit: "n/a"
    last_verified_utc: "2026-05-06T00:00:00Z"
    owner: "yann"
    notes: |
      Per CLAUDE.md directive #4: never test/benchmark/optimize. Status
      `retired` reflects the runtime stance (capability remains as
      emergency fallback, but no claim of value is made). AUDIT2
      2026-04-24 flagged "DEAD CODE" framing as contradicted by the
      live fallback path; this entry records the corrected framing.
