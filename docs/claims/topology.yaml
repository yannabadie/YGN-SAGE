    evidence_benchmark: "n/a"
    evidence_commit: "n/a"
    last_verified_utc: "2026-05-06T00:00:00Z"
    owner: "yann"
    notes: |
      Per cgpro 2026-05-06 ALIRE.md review: keeping in main requires
      (1) explicit feature flag, (2) default-off, (3) claim
      opt-in/experimental in registry (this entry), (4) source-and-
      env default-off guard test (Phase 0.5 + 0.6 of cycle-13 K).
