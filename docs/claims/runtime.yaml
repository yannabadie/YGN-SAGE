    description: "OracleStack is default-on since cycle-7 (commit 128e1b89). Bandit / MAP-Elites / online-evolution / training-memory updates require verdict.trainable=True."
    evidence_test: "sage-python/tests/test_oracle_stack.py"
    evidence_benchmark: "n/a"
    evidence_commit: "128e1b89"
    last_verified_utc: "2026-05-06T00:00:00Z"
    owner: "yann"
    notes: |
      Kill-switch via SAGE_ORACLE=0|false|off|no|disable|disabled
      (case-insensitive). Predicate centralised in
      sage/runtime/oracle/env.py:oracle_enabled(). Companion test
      `test_oracle_env_predicate.py` covers the kill-switch matrix.

  - id: runtime.a14_epoch_guard
    status: delivered
    description: "A14 posterior epoch guard: posterior_epoch.json + topology_state_manifest.json bind declared epoch label to SHA-256 of all topology-state files. Fail-closed at boot."
    evidence_test: "sage-python/tests/test_save_state_manifest_contract.py"
    evidence_benchmark: "n/a"
    evidence_commit: "f9521616"
    last_verified_utc: "2026-05-06T00:00:00Z"
    owner: "yann"
    notes: |
      Round-2 closure 2026-04-30. Forensic load-only bypass via
      SAGE_BOOT_BYPASS_EPOCH_GUARD=1 + SAGE_BOOT_BYPASS_REASON +
      SAGE_OPERATOR_ID. atexit save disabled when bypass is active.
      Reset command: `python -m sage.ops.a14_reset --reason "..."`.

  - id: runtime.bandit_attribution
    status: delivered
    description: "Bandit posterior updates attributed to the FINALIZED model_id + executed template via route_integrated() + record_outcome_checked() (cycle-9 6f23eea4)."
    evidence_test: "sage-python/tests/test_pipeline_v2_bandit_attribution_invariant.py"
    evidence_benchmark: "n/a"
    evidence_commit: "6f23eea4"
    last_verified_utc: "2026-05-06T00:00:00Z"
    owner: "yann"
    notes: |
      Closes the 2026-04-26 cgpro find: pre-cycle-9 pipeline called
      legacy `_rust_router.route()` (bandit not consulted), then
      `bandit.select_with_context()` separately, dropping
      decision.model_id / decision.template, recording outcome against
      an orphan ID. Bandit posteriors updated for arms whose model
      never executed.

  - id: runtime.learning_side_effect_ledger_v0
    status: delivered
    description: "Audit-only learning side-effect sidecar: writes learning_side_effects.jsonl next to RuntimeEventLog traces and hash-links recorded learning decisions to runtime events. The validator rejects recorded oracle-on learning-update entries unless they are linked to a trainable OracleVerdict and allowed gate state; it does not prove complete coverage of every possible side-effect path, change CLI v0 stdout, or authorize learning."
    evidence_test: "sage-python/tests/test_learning_side_effect_ledger_contract.py"
    evidence_benchmark: "n/a"
    evidence_commit: "65f7c5c5"
    last_verified_utc: "2026-05-09T20:10:07Z"
    owner: "yann"
    notes: |
      Sidecar contract lives in
      docs/contracts/learning-side-effect-ledger.md. It is deliberately
      NOT a new RuntimeEventLog event type and NOT an 11th runtime
      integrity invariant: it reinforces invariant 2 (Oracle evidence)
      and invariant 6 (Bandit attribution) as audit evidence only.
      `validate_trace_dir()` checks sidecar existence, schema version,
      monotonic seq/hash chain, parent RuntimeEventLog payload hashes,
      oracle_verdict_ref consistency, and rejection of allowed oracle-on
      learning updates unless the oracle verdict is trainable. Runtime
      writes are fail-open; evidence gates should run the validator and
      fail on absent/invalid ledgers. This claim is record-correctness
      evidence, not a full completeness proof for every possible runtime
      side-effect path.

