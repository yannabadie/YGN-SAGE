    evidence_benchmark: "n/a"
    evidence_commit: "f647c5ae"
    last_verified_utc: "2026-05-06T00:00:00Z"
    owner: "yann"
    notes: |
      Count was 8 through cycle-11; cycle-12 commit f647c5ae backported
      invariant 9 (CLI protocol versioning), and cycle-13 K Phase 1.5
