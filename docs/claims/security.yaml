# Security claims — see docs/claims/routing.yaml for schema documentation.

claims:
  - id: security.prompt_injection_detection
    status: default-on
    description: "PromptInjectionDetector is wired at AgentLoop.run() task-ingest and canonical pipeline_v2 ingress. Both invoke detection by default; AgentLoop emits PROMPT_INJECTION_DETECTED through its event bus when present, and pipeline ingress emits RuntimeEventLog prompt_injection_detected when runtime event logging is active. Default behavior is detection/eventing only, not refusal."
    evidence_test: "sage-python/tests/security/test_prompt_injection_pipeline.py"
    evidence_benchmark: "n/a"
    evidence_commit: "5984f6c9"
    last_verified_utc: "2026-05-09T11:41:48Z"
    owner: "yann"
    notes: |
      `sage.pipeline` is a facade; the canonical pipeline ingress lives in
      `sage-python/src/sage/pipeline_v2/orchestrator.py`. Detection runs
      after `task_started` and before classify/decompose/topology. The
      default pipeline path continues after detection; when RuntimeEventLog is
      active it emits `prompt_injection_detected`. `AgentLoop.run()` emits its
      existing PROMPT_INJECTION_DETECTED event when its event bus is present.
      This is not a claim of default event persistence, default refusal, full
      prompt-injection mitigation, CLI adapter protection, benchmark harness
      protection, or TypeScript adapter delivery. Companion tests
      `tests/security/test_prompt_injection.py` and
      `tests/security/test_prompt_injection_wiring.py` cover detector and
      AgentLoop behavior.

  - id: security.prompt_injection_strict_refusal
    status: opt-in
    description: "When SAGE_PROMPT_INJECTION_STRICT=1, canonical pipeline_v2 ingress refuses matched prompt-injection tasks before orchestration and emits final_result(status=failure, node_count=0)."
    evidence_test: "sage-python/tests/security/test_prompt_injection_pipeline.py"
    evidence_benchmark: "n/a"
    evidence_commit: "5984f6c9"
    last_verified_utc: "2026-05-09T11:41:48Z"
    owner: "yann"
    notes: |
      Strict refusal is pipeline_v2 ingress behavior only. The test asserts
      the refusal emits `task_started`, `prompt_injection_detected`, and
      `final_result(status="failure", node_count=0)`, and that downstream
      routing/topology/model/oracle/run-frame events plus patched classify,
      decompose, select_topology, assign_models, execute, learn, and memory
      recording are absent. AgentLoop.run() remains detection/eventing only;
      this is not a claim of full prompt-injection mitigation or default
      blocking.

  - id: security.sandbox_default_wasi
    status: default-on
    description: "Tool execution sandboxed by default via embedded RustPython wasm32-wasip1 deny-by-default WASI-p1 (ADR-013 §5 flip 2026-04-22). validate_and_execute does NOT fall back to subprocess."
    evidence_test: "sage-python/tests/test_wasm_sandbox_ci_contract.py"
    evidence_benchmark: "n/a"
    evidence_commit: "5619b3cf"
    last_verified_utc: "2026-05-06T00:00:00Z"
    owner: "yann"
    notes: |
      `execute_raw` (which bypasses both AST validation AND the sandbox)
      remains gated by SAGE_UNSAFE_RAW_EXEC=1. SAGE_UNSAFE_UNSANDBOXED
      gate removed in §5 flip. Companion tests
      `test_wasm_sandbox_redteam.py` (40-attack matrix) and
      `test_sandbox_fail_closed.py`.

  - id: security.dangerous_tools_default_off
    status: default-on
    description: "AgentConfig.dangerous_tools defaults to False. execute_bash NOT registered at boot. Opt-in via SAGE_DANGEROUS_TOOLS=1."
    evidence_test: "sage-python/tests/test_boot_sandbox_warning.py"
    evidence_benchmark: "n/a"
    evidence_commit: "5619b3cf"
    last_verified_utc: "2026-05-06T00:00:00Z"
    owner: "yann"
    notes: |
      Per CLAUDE.md (2026-04-23 flip). SWE-bench N=10 paired smoke showed
      typed-only produces 4/10 patches vs bash 3/10 — functional criterion
      met before the flip. Companion test
      `test_boot_sandbox_warning.py` verifies the boot path emits the
      warning when SAGE_DANGEROUS_TOOLS=1 is set.

  - id: security.tool_policy_default_deny
    status: default-on
    description: "Phase 1.5 (cycle-13 K) ToolPolicy capability manifest: every tool declares one of 6 capability tiers (pure/read_local/write_local/network/subprocess/dangerous). Default effective policy is `{pure}` only — every other tier requires an explicit grant via SAGE_TOOL_GRANTS env, ~/.sage/tool_policy.toml, or programmatic policy.grant()."
    evidence_test: "sage-python/tests/test_tool_policy.py"
    evidence_benchmark: "n/a"
    evidence_commit: "5a4cfd1e"
    last_verified_utc: "2026-05-06T00:00:00Z"
    owner: "yann"
    notes: |
      Per cgpro DESIGN_LOCKED 2026-05-06 conv `cgpro_phase15_toolpolicy_20260506`
      (in YGN-SAGE project). 4-commit chain: feat(policy) schema, feat(tools)
      enforcement + Tool.execute last-resort gate, feat(agent) boot ContextVar
      propagation, test(docs) 15 tests + audit CLI + ledger invariant 10 +
      docs. Phase 1.5 is declarative gate at registration + runtime — NOT
      behavior verification. A `pure` tool can still lie at runtime; the
      contract is "declared capability is the maximum-safe summary, gates
      block at registration and at Tool.execute boundary".

      No hierarchical implicit closure: granting `dangerous` does NOT also
      grant `network`. Each tier is granted exactly. Built-in tool manifest
      at `sage-python/src/sage/policy/manifest.py` covers 31 tools at ship
      time; AgentTool defaults to `dangerous` via class-level default
      because it delegates to arbitrary agent.run().
