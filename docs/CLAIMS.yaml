  notes: 'CI-runnable strict-equal floor over committed

    `sage-python/config/routing_ground_truth.json` +

    `sage-python/config/routing_exemplars.npz` (60 × 768 float32

    L2-normalized, built once via

    `scripts/build_routing_exemplars.py`).


    The test validates artifact shape/dtype/L2-norm/label alignment

    first, then runs byte-equivalent LOO-CV (cosine dot product, k=5,

    `np.argpartition`, weighted majority vote) — same mechanics as the

    builder''s `--validate` path.


    Empirical baseline 2026-05-07: 50/60 overall, S1=16/20, S2=15/20,

    S3=19/20. The floor EQUALS the empirical baseline by design: this

    is a **strict-equal drift sentinel**, not a statistical margin.

    Because the dataset, embeddings, and scoring rule are fully frozen,

    the only legitimate source of variance is router/scoring drift or

    intentional artifact regeneration — and both MUST trip CI

    immediately.  Loose-margin floors would silently absorb a genuine

    regression.


    **target_next** (non-blocking aspiration, not CI-enforced):

    knn≥52/60 overall. Future router improvements should push the

    baseline above the current floor, creating a real statistical

    margin before raising the floor.


    If `routing_ground_truth.json`, `routing_exemplars.npz`, or the

    scoring logic changes intentionally, update the floor constants

    in the same commit, with the new measured baseline documented here.


    The historical 92% figure traces back to

    `scripts/eval_deberta_zeroshot.py:625` — "kNN (arctic-embed): 92.0%

    (46/50)" — measured on a 50-task subset prior to the GT expansion to

    60 tasks. Provenance only, not directly comparable.

    '
